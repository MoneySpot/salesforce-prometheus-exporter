# Custom SOQL Queries for Prometheus Metrics
#
# SECURITY NOTE:
# - Queries with labels/label_fields are disabled by default
# - Set ALLOW_CUSTOM_LABELS=true to enable (may expose sensitive data)
# - Always use LIMIT clauses to prevent excessive data retrieval
# - Prefer aggregate queries (COUNT, SUM, AVG) over row-level data

metrics:
  # Simple count query - safe, no labels
  - name: sfdc_user_count
    description: Total number of active users
    query: SELECT COUNT() FROM User WHERE IsActive = true
    value_field: totalSize

  # Account count - safe, no labels
  - name: sfdc_account_count
    description: Total number of accounts
    query: SELECT COUNT() FROM Account
    value_field: totalSize

  # Opportunity count - safe, no labels
  - name: sfdc_opportunity_count
    description: Total number of open opportunities
    query: SELECT COUNT() FROM Opportunity WHERE IsClosed = false
    value_field: totalSize

  # Case count - safe, no labels
  - name: sfdc_case_count
    description: Total number of open cases
    query: SELECT COUNT() FROM Case WHERE IsClosed = false
    value_field: totalSize

