# fly.toml app configuration file generated for salesforce-prometheus-exporter on 2026-01-22T10:38:30+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'salesforce-prometheus-exporter'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[[metrics]]
  port = 3000
  path = '/metrics'
